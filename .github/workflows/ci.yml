name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Pin npm 11.17.0
        run: npm install --global npm@11.17.0

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "11.17.0"

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Test public source boundary and Runtime clients
        run: npm test

      - name: Test terminal IME input handling
        run: npm run test:ime

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Reproduce split packages and verify compatibility payload
        run: npm run verify:packages:exact-split -- --out-dir "$RUNNER_TEMP/lumeri-pack"

  windows-irm-install:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Pin npm 11.17.0
        shell: powershell
        run: npm.cmd install --global npm@11.17.0

      - name: Install dependencies without lifecycle scripts
        shell: powershell
        run: npm.cmd ci --ignore-scripts --no-audit --no-fund

      - name: Verify Windows source contracts
        shell: powershell
        run: |
          node.exe test/windows-installer.mjs
          node.exe test/open-security.mjs
          node.exe test/product-entrypoints.mjs

      - name: Parse Windows PowerShell installers
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath install/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_ }
            }
          }
          if ($failed) { exit 1 }

      - name: Install both public CLIs through irm
        shell: powershell
        run: |
          $installPrefix = Join-Path $env:RUNNER_TEMP "lumeri-irm-install"
          $env:npm_config_prefix = $installPrefix
          irm https://cli.lumeri.io/windows/install-video.ps1 | iex
          irm https://cli.lumeri.io/windows/install-quanta.ps1 | iex

          & (Join-Path $installPrefix "luvi.cmd") --help
          if ($LASTEXITCODE -ne 0) { throw "luvi --help failed after irm installation" }
          & (Join-Path $installPrefix "luqu.cmd") --help
          if ($LASTEXITCODE -ne 0) { throw "luqu --help failed after irm installation" }

  reproduce-compatibility-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 26.5.0
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm

      - name: Pin npm 11.17.0
        run: npm install --global npm@11.17.0

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v26.5.0"
          test "$(npm --version)" = "11.17.0"

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Reproduce the frozen compatibility package exactly
        run: npm run pack:compat -- --out-dir "$RUNNER_TEMP/lumeri-compat-pack"
